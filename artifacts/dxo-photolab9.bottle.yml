# DxO PhotoLab 9 — Bottles config backup
# Import in Bottles: Import → "Import a config backup" → pick this file.
# Bottles creates the bottle, selects the runner/DXVK/VKD3D below, replays the
# dependency list in order and carries the Registry Rules into the bottle.
#
# Pairs with the photolab-wine runner published as a GitHub Release of
# jackm97/photolab-bottles, and with the catalogs in docs/bottles-setup.md
# (they provide the runner and the netfx48-winrt dependency). After importing,
# run DxO's own Setup.exe in the bottle and activate DxO. A newer photolab-wine
# runner can be selected in the bottle's settings.

Name: DxO PhotoLab 9
Arch: win64
Environment: Custom

Windows: win11

Runner: photolab-wine-d67f859
DXVK: dxvk-3.1.1
VKD3D: vkd3d-proton-3.0.1
NVAPI: ""
D7VK: ""
LatencyFleX: ""

Versioning: false
Language: sys

Parameters:
  dxvk: true
  vkd3d: true
  wayland: true
  renderer: vulkan
  dxvk_nvapi: false
  d7vk: false
  latencyflex: false
  sync: wine
  discrete_gpu: false
  use_runtime: false
  use_steam_runtime: false
  winebridge: false
  sandbox: false
  fixme_logs: false
  mouse_warp: true
  decorated: true
  take_focus: false
  virtual_desktop: false
  custom_dpi: 96

Environment_Variables:
  # Hide Mesa's lavapipe ICD from the Vulkan loader so vkd3d-proton / ONNX
  # Runtime cannot pick the software device instead of the real GPU.
  VK_LOADER_DRIVERS_DISABLE: "lvp_icd.*"
  # Chromium inside WebView2 crashes under Wine without these.
  WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--no-sandbox --disable-gpu --disable-gpu-compositing"

# Replayed in this order on import.
Installed_Dependencies:
  - dotnet48
  - vcredist2022
  - d3dcompiler_47
  - allfonts
  - netfx48-winrt

DLL_Overrides: {}

Registry_Rules:
  - name: WPF software rendering
    description: >
      PhotoLab's WPF UI renders black menus with GPU composition under Wine.
      Forces WPF (Avalon) to software rendering; DeepPRIME/GPU compute is unaffected.
    triggers: [components]
    run_once: false
    keys: |
      REGEDIT4

      [HKEY_CURRENT_USER\Software\Microsoft\Avalon.Graphics]
      "DisableHWAcceleration"=dword:00000001

  - name: WebView2 uses Wine builtin D3D
    description: >
      DXVK cannot drive the DirectComposition path msedgewebview2.exe uses.
      Per-application override keeps DXVK/vkd3d for PhotoLab itself.
    triggers: [components]
    run_once: false
    keys: |
      REGEDIT4

      [HKEY_CURRENT_USER\Software\Wine\AppDefaults\msedgewebview2.exe\DllOverrides]
      "d3d9"="builtin"
      "d3d10core"="builtin"
      "d3d11"="builtin"
      "d3d12"="builtin"
      "d3d12core"="builtin"
      "dxgi"="builtin"
