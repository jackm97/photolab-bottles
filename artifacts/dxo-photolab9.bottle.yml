# DxO PhotoLab 9 — Bottles config backup
#
# Import
#   Import a config backup, then run DxO's own Setup.exe in the bottle and
#   activate DxO.
#   Runner: soda-11.0-35-photolab-b649ee9 (Bottles unstable channel). The soda-
#   prefix enables Bottles' Soda helpers and Eagle. The catalogs are in
#   docs/bottles-setup.md.
#
# Kept
#   DXVK dxvk-3.1.1 + dxvk:true: D3D11 legacy viewer, DXGI enumeration, WPF
#     d3d9; also provides DXVKDUMMYWNDCLASS, which Soda's dcomp bridge relies on.
#   VKD3D vkd3d-proton-3.0.1 + vkd3d:true: DxO's engine statically imports
#     d3d12!D3D12GetInterface; DirectML runs on it.
#   Windows win10 + rule "Windows 11 build 26100": DxO's bootstrapper rejects
#     builds below 19045 and 22000-22620; Bottles' win11 preset writes 22000;
#     dotnet48 leaves a win10 build behind; rules fire after dependencies.
#   ".NET OnlyUseLatestCLR": observed WineHQ 41727 popups.
#   Dependencies in order: dotnet48 (.NET 4.8 WPF app), vcredist2022 (DxO
#     native DLLs), netfx48-winrt (installer aborts without it).
#   wayland:true is the target; set it to false for X11.
#   discrete_gpu:true: otherwise Bottles pins VK_ICD_FILENAMES to the iGPU on
#     hybrid machines.
#
# Dropped
#   WPF software rendering rule: WPF ignored it (d3d9 still loaded), and DxO
#     enables hardware WPF by design (App.xaml.cs EnableWpfGpuAcceleration true).
#   WebView2 builtin D3D rule: builtin dxgi's CreateSwapChainForComposition is
#     an E_NOTIMPL stub, and the rule defeats Soda's dcomp bridge, which needs
#     DXVK in msedgewebview2.
#   WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: the flags don't avoid
#     DirectComposition.
#   VK_LOADER_DRIVERS_DISABLE: redundant, because Bottles sets
#     VK_ICD_FILENAMES.
#   renderer:vulkan: only affects wined3d; the Bottles default applies.
#   pulseaudio_latency: Bottles default applies.
#   d3dcompiler_47: no DxO import found; DXVK and vkd3d compile their own
#     shaders.
#   arial32/times32/courie32: not shown to be needed by DxO.
#
# Experiments
#   If the DxO Hub (WebView2) is blank under Wayland, first try
#   Environment_Variables DXVK_CONFIG: "dxgi.enableDummyCompositionSwapchain =
#   True". Soda's dcomp patch matches DXVK's dummy composition window, and that
#   option defaults to False. It is not set here. NVAPI and sync choices are
#   not set either.

Name: DxO PhotoLab 9
Arch: win64
Environment: Custom

Windows: win10

Runner: soda-11.0-35-photolab-b649ee9
DXVK: dxvk-3.1.1
VKD3D: vkd3d-proton-3.0.1

Versioning: false
Language: sys

Parameters:
  dxvk: true
  vkd3d: true
  wayland: true
  discrete_gpu: true

Environment_Variables: {}

# Replayed in this order on import.
Installed_Dependencies:
  - dotnet48
  - vcredist2022
  - netfx48-winrt

DLL_Overrides: {}

Registry_Rules:
  - name: Windows 11 build 26100
    description: >
      RtlGetVersion-visible build 26100 for 64-bit and 32-bit (Wow6432Node)
      processes, and removal of Wine's per-user version override.
    triggers: [all]
    run_once: false
    keys: |
      REGEDIT4

      [HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion]
      "CurrentMajorVersionNumber"=dword:0000000a
      "CurrentMinorVersionNumber"=dword:00000000
      "CurrentBuildNumber"="26100"
      "CurrentBuild"="26100"
      "CurrentVersion"="6.3"

      [HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\Windows NT\CurrentVersion]
      "CurrentMajorVersionNumber"=dword:0000000a
      "CurrentMinorVersionNumber"=dword:00000000
      "CurrentBuildNumber"="26100"
      "CurrentBuild"="26100"
      "CurrentVersion"="6.3"

      [HKEY_CURRENT_USER\Software\Wine]
      "Version"=-

  - name: .NET OnlyUseLatestCLR
    description: >
      Backs up the netfx48-winrt dependency: the CLR 4 runtime is always used.
    triggers: [all]
    run_once: false
    keys: |
      REGEDIT4

      [HKEY_LOCAL_MACHINE\Software\Microsoft\.NETFramework]
      "OnlyUseLatestCLR"=dword:00000001

      [HKEY_LOCAL_MACHINE\Software\Wow6432Node\Microsoft\.NETFramework]
      "OnlyUseLatestCLR"=dword:00000001
