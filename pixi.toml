[workspace]
name = "photolab-bottles"
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.83.0"

[dependencies]
python = "3.13.*"
msitools = "*"
7zip = "*"
cabextract = "*"
zig = "*"
vulkan-tools = "*"
nushell = "*"

[pypi-dependencies]
pefile = "*"
olefile = "*"

# Wine build dependencies.
[feature.dev.dependencies]
# toolchain
gcc = "*"
gxx = "*"
make = "*"
bison = "*"
flex = "*"
pkg-config = "*"
perl = "*"
gettext = "*"
autoconf = "*"
automake = "*"
python = "3.13.*"
clang = "*"
lld = "*"
llvm-tools = "*"
ccache = "*"
# host libraries
freetype = "*"
fontconfig = "*"
gnutls = "*"
krb5 = "*"
xorg-libx11 = "*"
xorg-libxext = "*"
xorg-libxrender = "*"
xorg-libxrandr = "*"
xorg-libxi = "*"
xorg-libxcursor = "*"
xorg-libxfixes = "*"
xorg-libxcomposite = "*"
xorg-libxinerama = "*"
xorg-libxxf86vm = "*"
libxkbcommon = "*"
wayland = "*"
wayland-protocols = "*"
libgl-devel = "*"
libegl-devel = "*"
vulkan-headers = "*"
libvulkan-loader = "*"
alsa-lib = "*"
pulseaudio-client = "*"
pipewire = "*"
dbus = "*"
libudev = "*"
sdl2 = "*"
gstreamer = "*"
gst-plugins-base = "*"
ffmpeg = "*"
libpcap = "*"
libunwind = "*"
libusb = "*"
zlib = "*"

[feature.git.dependencies]
git = "*"
nushell = "*"

[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments]
git = { features = ["git"], no-default-feature = true }
dev = { features = ["dev"], no-default-feature = true }
