[workspace]
name = "photolab-bottles"
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["conda-forge"]
# pixi solves with conservative default virtual packages (glibc 2.28); the 2.34
# sysroot's run-export is `__glibc >=2.34`, so declare that baseline.
platforms = [{ platform = "linux-64", name = "linux-64-glibc234", glibc = "2.34" }]
preview = ["pixi-build"]
requires-pixi = ">=0.83.0"

# Compiler stems resolve to <stem>_<platform> activation packages (gcc_linux-64,
# gxx_linux-64); their activation exports CC/CXX/CFLAGS/LDFLAGS. The C stdlib is
# the conda sysroot at glibc 2.34, the oldest conda-forge sysroot that declares
# gettid and the baseline that keeps the build relocatable to newer systems.
[workspace.build-variants]
c_compiler           = ["gcc"]
cxx_compiler         = ["gxx"]
c_stdlib             = ["sysroot"]
c_stdlib_version     = ["2.34"]

# ---- default environment: our Wine build and the analysis tools ---------------
[dependencies]
photolab-wine = { path = "wine" }
python = "3.13.*"
msitools = "*"
7zip = "*"
cabextract = "*"
zig = "*"
vulkan-tools = "*"
nushell = "*"

[pypi-dependencies]
pefile = "*"
olefile = "*"

[tasks]
prefix-deps = { cmd = "nu scripts/prefix-deps.nu {{ prefix }}", args = [{ arg = "prefix", default = ".prefixes/dxo" }] }
prefix-dxvk = { cmd = "nu scripts/prefix-dxvk.nu {{ prefix }}", args = [{ arg = "prefix", default = ".prefixes/dxo" }] }
prefix-winver = { cmd = "nu scripts/prefix-winver.nu {{ prefix }}", args = [{ arg = "prefix", default = ".prefixes/dxo" }] }
prefix-netfx-winrt = { cmd = "nu scripts/prefix-netfx-winrt.nu {{ prefix }}", args = [{ arg = "prefix", default = ".prefixes/dxo" }] }
dxo-setup = { cmd = "nu scripts/dxo-setup.nu {{ prefix }}", args = [{ arg = "prefix", default = ".prefixes/dxo" }] }
dxo-run = { cmd = "nu scripts/dxo-run.nu {{ prefix }}", args = [{ arg = "prefix", default = ".prefixes/dxo" }] }

# ---- dev environment: for debugging only (build closure of photolab-wine, not built) ----
[feature.dev.dev]
photolab-wine = { path = "wine" }

# Debugging tools only.
[feature.dev.dependencies]
ccache = "*"
nushell = "*"

# ---- re environment: reverse engineering of DxO's installer (read-only analysis) ----
[feature.re.dependencies]
openjdk = "25.*"
dotnet-sdk = "10.*"
nushell = "*"
7zip = "*"
cabextract = "*"
python = "3.13.*"

[feature.re.pypi-dependencies]
olefile = "*"

[feature.re.tasks]
# dotnet refuses to reinstall a tool, so skip when ilspycmd is already there.
re-tools = { cmd = '''nu -c 'if not ("build/tools/ilspy/ilspycmd" | path exists) { ^dotnet tool install ilspycmd --tool-path build/tools/ilspy }' ''', env = { DOTNET_CLI_TELEMETRY_OPTOUT = "1" } }
re-extract = "nu scripts/re/extract.nu"
# Pinned Ghidra release (not on conda-forge); skips when already unpacked, verifies SHA-256 otherwise.
re-ghidra = "nu scripts/re/ghidra.nu"

[feature.git.dependencies]
git = "*"
nushell = "*"

[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments]
git = { features = ["git"], no-default-feature = true }
dev = { features = ["dev"], no-default-feature = true }
re = { features = ["re"], no-default-feature = true }
