[workspace]
name = "photolab-bottles"
authors = ["Jack Myers <jack@myersjack.dev>"]
channels = ["conda-forge"]
platforms = ["linux-64"]
preview = ["pixi-build"]
requires-pixi = ">=0.83.0"

[dependencies]
python = "3.13.*"
msitools = "*"
7zip = "*"
cabextract = "*"
zig = "*"
vulkan-tools = "*"
nushell = "*"

[pypi-dependencies]
pefile = "*"
olefile = "*"

# Wine build dependencies (filled in by phase 1a step 2).
[feature.dev.dependencies]

[feature.git.dependencies]
git = "*"
nushell = "*"

[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments]
git = { features = ["git"], no-default-feature = true }
dev = { features = ["dev"], no-default-feature = true }
